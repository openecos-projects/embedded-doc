INHERIT: cfg/mkdocs_base.yml

docs_dir: src/en
site_dir: site/en

site_name: ECOS Embedded
site_url: !ENV READTHEDOCS_CANONICAL_URL

edit_uri: edit/main/doc/src/en

repo_url: https://github.com/openecos-projects/embedded-doc
repo_name: openecos-projects/embedded-doc

theme:
  palette:
  - scheme: default
    primary: blue
    accent: blue
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: blue
    accent: blue
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  language: en

extra:
  alternate:

nav:
  - Home: index.md
  - Boards:
    - page/brd/index.md
    - StarrySky L:
      - page/brd/starry-sky-l/index.md
      - v1.2 (YSYX Phase 3): page/brd/starry-sky-l/v1.2.md
      - v1.3 (YSYX Phase 3): page/brd/starry-sky-l/v1.3.md
      - v2.1 (YSYX Phase 4): page/brd/starry-sky-l/v2.1.md
      - v3.0 (YSYX Phase 5): page/brd/starry-sky-l/v3.0.md
      - v3.1 (YSYX Phase 5): page/brd/starry-sky-l/v3.1.md
      - v4.0: page/brd/starry-sky-l/v4.0.md
    - StarrySky C:
